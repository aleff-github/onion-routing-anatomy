# One-time build for the multilingual 7x10 feature branch.
# PDF commit is created by CI; this workflow is removed separately after QA. Main is never updated.
name: Bootstrap multilingual 7x10 PDFs
on:
  push:
    branches:
      - feature/print-7x10-multilingual

permissions:
  contents: write

concurrency:
  group: bootstrap-print-7x10
  cancel-in-progress: true

jobs:
  compile-and-save:
    if: github.repository == 'aleff-github/onion-routing-anatomy' && github.ref == 'refs/heads/feature/print-7x10-multilingual'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF auditing requirements
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check -r scripts/requirements-print.txt
          python -m py_compile scripts/build_print.py scripts/check_print.py scripts/compare_print_content.py scripts/check_print_regression.py

      - name: Verify preexisting digital editions and print-only figure branches
        run: python scripts/check_print_regression.py

      - name: Pull reproducible TeX environment
        run: docker pull texlive/texlive@sha256:07e8062637249c4f780ca59f42cc2ed592bc2dc1db4320769406aee3f98aa70e

      - name: Compile all five print variants in isolated staging areas
        run: python scripts/build_print.py all --image texlive/texlive@sha256:07e8062637249c4f780ca59f42cc2ed592bc2dc1db4320769406aee3f98aa70e

      - name: Check all pages, source fidelity and normal repository checks
        run: |
          set -euo pipefail
          python scripts/check_print.py it en es ru zh-Hans
          python scripts/compare_print_content.py it en es ru zh-Hans
          make check

      - name: Generate public PDF checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, pymupdf
          names = {'en':'anatomy-of-tor_en','es':'anatomía-de-tor_es',
                   'ru':'анатомия-tor_ru','zh-Hans':'tor-解剖_zh-Hans'}
          result = {'format':'7x10 in', 'version':'1.0.0',
                    'page_dimensions_pt':[504,720], 'editions':{}}
          for lang,name in names.items():
              pdf=Path('book')/lang/(name+'_7x10.pdf')
              audit=json.loads((Path('build/print-audit')/(lang+'-audit.json')).read_text())
              compare=json.loads((Path('build/print-audit')/(lang+'-content-comparison.json')).read_text())
              build=json.loads((Path('build/print-audit')/(lang+'-build.json')).read_text())
              digest=hashlib.sha256(pdf.read_bytes()).hexdigest()
              assert audit['status']=='AUTOMATED_PASS' and not audit['errors'] and not audit['warnings'], lang
              assert compare['status']=='PASS', lang
              assert build['exit_code']==0 and build['sha256']==digest, lang
              with pymupdf.open(pdf) as doc:
                  pages=len(doc)
                  assert pages==audit['pages'] and pages<=400
                  assert all(abs(p.rect.width-504)<.1 and abs(p.rect.height-720)<.1 for p in doc)
              result['editions'][lang]={'file':str(pdf),'pages':pages,
                  'sha256':digest,'pdf_audit':'AUTOMATED_PASS','a4_content_comparison':'PASS'}
          Path('book/print-7x10-manifest.json').write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Commit verified PDFs without changing workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git add -f -- "book/en/anatomy-of-tor_en_7x10.pdf"
          git add -f -- "book/es/anatomía-de-tor_es_7x10.pdf"
          git add -f -- "book/ru/анатомия-tor_ru_7x10.pdf"
          git add -f -- "book/zh-Hans/tor-解剖_zh-Hans_7x10.pdf"
          git add -- book/print-7x10-manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build: add validated 7x10 PDFs for EN ES RU and ZH [skip ci]"
          git push origin HEAD:refs/heads/feature/print-7x10-multilingual
