name: Temporary 7x10 website verification
on:
  push:
    branches:
      - feature/site-print-7x10-downloads
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate multilingual site
        run: |
          set -euo pipefail
          python3 scripts/build_site.py build
          python3 scripts/build_site.py check
          python3 scripts/check_public_copy.py
      - name: Confirm download links in all language pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          c=tomllib.loads(Path('website/site.toml').read_text())
          assert len(c['languages'])==5
          for lang in c['languages']:
              r=c['translated_releases'][lang] if lang!='it' else c['release']
              homepage=Path('build/site')/lang/'index.html'
              languages=Path('build/site')/lang/'languages/index.html'
              expected=f'https://github.com/aleff-github/onion-routing-anatomy/releases/download/{r["tag"]}/{r["print"]}'
              assert homepage.is_file() and languages.is_file(), lang
              assert expected in homepage.read_text(), (lang,expected)
              table=languages.read_text()
              assert table.count('_7x10.pdf')>=5, lang
              print(lang,'homepage print release link and five edition links PASS')
          PY
