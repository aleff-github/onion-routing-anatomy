# SPDX-License-Identifier: GPL-3.0-or-later
# QA della prima edizione italiana. Questa procedura NON crea release, tag o Pages.
name: QA edizione italiana (pre-release)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/italian-release-qa.yml"
      - "Makefile"
      - "requirements.txt"
      - "source/it/**"
      - "source/shared/**"
      - "source/branding/**"
      - "book/it/**"
      - "labs/it/**"
      - "scripts/**"
      - "website/**"
      - "docs/releases/v1.0.0-it.md"
      - "docs/maintainers/**"

concurrency:
  group: italian-release-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controlli:
    name: Sorgenti e test offline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze dei test
        run: python -m pip install -r requirements.txt
      - name: Controlli dei sorgenti
        run: make check
      - name: Test offline
        run: make test
      - name: Verifica della cronologia nel contesto corretto
        run: |
          if test -f scripts/export_public_snapshot.py; then
            # Repository privata: controlla lo snapshot, non la storia di sviluppo.
            python3 scripts/export_public_snapshot.py \
              --out "$RUNNER_TEMP/onion-release-snapshot" \
              --author "Release QA <qa@example.org>"
            make -C "$RUNNER_TEMP/onion-release-snapshot" verifica-cronologia
          else
            # Nuova repository editoriale: la storia deve essere direttamente pulita.
            make verifica-cronologia
          fi
      # Usa gli artefatti già versionati in book/it e le loro impronte
      # nelle note. La ricompilazione fresh è nel job successivo.
      - name: Pacchetto privato versionato (licenza, NOTICE e SHA-256)
        run: |
          make release-package
          make release-check
          test -f dist/onion-routing-anatomy-v1.0.0-it/NOTICE.md
          (cd dist/onion-routing-anatomy-v1.0.0-it && sha256sum -c SHA256SUMS)
      - name: La release italiana esclude tutte le bozze tradotte
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pkg = Path("dist/onion-routing-anatomy-v1.0.0-it")
          expected = {
              "anatomia-di-tor_it_A4.pdf",
              "anatomia-di-tor_it.epub",
              "anatomia-di-tor_it_7x10.pdf",
              "anatomia-di-tor_it_copertina.png",
              "RELEASE-NOTES.md", "LICENSE", "NOTICE.md", "SHA256SUMS",
          }
          actual = {x.name for x in pkg.iterdir() if x.is_file()}
          if actual != expected:
              raise SystemExit(f"Contenuto del pacchetto inatteso: {sorted(actual ^ expected)}")
          print("Pacchetto riservato all'edizione italiana: OK")
          PY

  compilazione:
    name: PDF, EPUB e verifica impaginazione italiana
    needs: controlli
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strumenti per PDF e EPUBCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils epubcheck
      - name: Compilazione completa (TeX Live in Docker)
        run: make book
      - name: Composizione dei listati nel PDF
        run: make composizione LINGUE=it
      - name: Validazione EPUB
        run: make epub-check LINGUE=it
      - name: Verifica artefatti e anomalie note dell'indice
        run: |
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path
          nomi = (
              "anatomia-di-tor_it_A4.pdf",
              "anatomia-di-tor_it_7x10.pdf",
              "anatomia-di-tor_it.epub",
              "anatomia-di-tor_it_copertina.png",
          )
          base = Path("book/it")
          for nome in nomi:
              if not (base / nome).is_file() or not (base / nome).stat().st_size:
                  raise SystemExit(f"Artefatto assente o vuoto: {nome}")
          pdf = base / nomi[0]
          testo = subprocess.check_output(["pdftotext", "-layout", str(pdf), "-"], text=True)
          if "Proposal NNN" in testo:
              raise SystemExit("Anomalia: l'esempio Proposal NNN è ancora nel PDF")
          sito = tomllib.loads(Path("website/site.toml").read_text(encoding="utf-8"))
          pagine_attese = (sito["edition"]["pages_a4"], sito["edition"]["pages_7x10"])
          for nome, attese in zip((nomi[0], nomi[1]), pagine_attese):
              info = subprocess.check_output(["pdfinfo", str(base / nome)], text=True)
              pagine = int(next(r.split(":", 1)[1].strip() for r in info.splitlines()
                                if r.startswith("Pages:")))
              if pagine != attese:
                  raise SystemExit(f"{nome}: {pagine} pagine, attese {attese}")
              print(f"{nome}: {pagine} pagine (coerenti con il sito)")
          PY
      - name: Calcolo nuove impronte di prova
        run: |
          mkdir -p dist/qa-it
          cd book/it
          sha256sum anatomia-di-tor_it_A4.pdf anatomia-di-tor_it.epub \
            anatomia-di-tor_it_7x10.pdf anatomia-di-tor_it_copertina.png \
            > ../../dist/qa-it/SHA256SUMS
          cat ../../dist/qa-it/SHA256SUMS
      - name: Conserva artefatti per la revisione (non pubblica)
        uses: actions/upload-artifact@v4
        with:
          name: bozza-italiana-qa
          path: |
            book/it/anatomia-di-tor_it_A4.pdf
            book/it/anatomia-di-tor_it_7x10.pdf
            book/it/anatomia-di-tor_it.epub
            book/it/anatomia-di-tor_it_copertina.png
            dist/qa-it/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
