body = """
<h1>Лаборатории</h1>
<p class="lead">Двадцать лабораторных работ шаг за шагом создают <code>torlab</code> —
небольшой учебный клиент Tor на Python: канал, ячейки, рукопожатия, шифрование, потоки,
каталоги, выбор пути, onion-сервисы и многое другое.</p>

<h2 id="set">Частная сеть Tor</h2>
<p>Код запускается в частной сети Tor, которая живёт на одном компьютере: tor {{tor}} и
Chutney, собранные из исходников в образе Docker, все службы слушают только 127.0.0.1. Ничто
не покидает машину.</p>
<p>Эксперименты рассчитаны только на эту частную сеть. Они никогда не проводятся на публичных
ретрансляторах или реальных пользователях — в соответствии с принципами Tor Research Safety
Board.</p>

<h2 id="provereno">Проверено, а не только описано</h2>
<p>28 октября 2026 года все итальянские лабораторные работы были заново выполнены в частной
