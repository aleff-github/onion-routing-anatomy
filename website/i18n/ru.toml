<h2 id="bez-git">Без Git и LaTeX</h2>
<p>Нужна только учётная запись GitHub. Выберите тип сообщения, заполните форму — язык, главу
или страницу, текущий текст и ваш вариант — и отправьте её. Этого достаточно: изменение в
исходниках внесёт кто-то другой.</p>
<p>Небольшую опечатку можно исправить и самостоятельно: откройте файл на GitHub, нажмите на
значок карандаша, измените текст и выберите «Propose changes». GitHub сам создаст копию
репозитория и pull request; собирать книгу не нужно.</p>

<h2 id="s-git">С Git</h2>
<ol>
<li>Сначала откройте issue, если это не мелкое исправление.</li>
<li>Найдите файл: итальянский текст — в <code>source/it/</code>, переводы — в
