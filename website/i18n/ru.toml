<li>Сделайте форк репозитория, создайте ветку и внесите изменение.</li>
<li>Запустите подходящие проверки: для <code>make check</code> и <code>make test</code> нужен
только Python, для сборки книги — Docker.</li>
<li>Откройте pull request и ответьте на замечания рецензента.</li>
</ol>
<p>Подробности — в <a href="{{blob}}/CONTRIBUTING.md">CONTRIBUTING.md</a> (на английском и
