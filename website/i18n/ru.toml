[pages.story]
title = "История проекта — Onion Routing Anatomy"
description = "Как появился Onion Routing Anatomy: изучение Tor для дипломной работы бакалавра, годы дальнейшей работы, лаборатории для проверки каждого механизма и свободная публикация."
body = """
<h1>История</h1>
<p class="lead">Проект начался как учёба и со временем превратился в техническую книгу с
собственными лабораторными работами. Здесь рассказано, как это произошло.</p>

<h2 id="istoki">С чего всё началось</h2>
<p>Работа над моей дипломной работой бакалавра стала для меня поводом изучить Tor глубже того
уровня, на котором его обычно описывают: не как им пользоваться, а что на самом деле
передаётся между ретрансляторами — ячейки, цепи, ключи и алгоритмы, которые всё это
связывают.</p>
<p>Мой интерес не закончился вместе с учёбой. С тех пор я продолжаю углублять этот материал,
перерабатывать и расширять его.</p>

<h2 id="kniga">От диплома к книге</h2>
<p>Со временем цель изменилась. Мне было уже недостаточно просто понимать Tor: задачей стала
техническая работа, способная объяснить его конкретно — вплоть до протокола, ячеек, цепей и
алгоритмов, — где каждое утверждение опирается на спецификации и исходный код.</p>

<h2 id="laboratorii">Зачем лаборатории</h2>
<p>Описание механизма не доказывает, что он работает так, как описан. Из этой потребности и
выросли лабораторные работы: частная сеть Tor на одном компьютере, где каждый шаг из текста
можно воспроизвести, измерить и проверить. Сейчас они — часть книги: их двадцать, и каждая
добавляет новый фрагмент к небольшому учебному клиенту Tor.</p>

<h2 id="svobodno">Почему бесплатно</h2>
<p>Моё решение — отдать приоритет свободному распространению знаний. Весь проект — книга, её
исходники в LaTeX, код и лабораторные работы — свободно доступен, чтобы любой мог изучать,
воспроизводить и улучшать его. Книга бесплатна; что с ней можно делать, определяет её
лицензия, GNU GPL.</p>
<p>Как был создан нынешний текст и какую роль в этом сыграли инструменты ИИ, рассказано на
странице <a href="{{p:ai}}">«Прозрачность ИИ»</a>.</p>
"""

[pages.book]
title = "О книге: содержание — Onion Routing Anatomy"
description = "Содержание Anatomia di Tor: история, протокол Tor на низком уровне, Tor на практике, атаки и защита, исследования и Arti. 31 глава и 176 упражнений."
body = """
<h1>О книге</h1>
<p class="lead">31 глава и 4 приложения, 176 упражнений разного уровня с решениями, 39
оригинальных иллюстраций. Опорные версии: tor {{tor}} и Arti {{arti}}.</p>
<p>Книга рассчитана на студентов вузов, специалистов по безопасности и исследователей,
знакомых с сетями (TCP/IP, TLS) и программированием. Технические утверждения опираются на
первоисточники — спецификации Tor, исходный код tor и Arti, предложения (proposals) Tor
Project и научные статьи — и снабжены ссылками в тексте.</p>

<h2 id="chast1">Часть I — История и основы</h2>
<p>Анонимность и метаданные; mix-сети и ремейлеры; от луковой маршрутизации в Исследовательской
лаборатории ВМС США (NRL) до Tor Project; модель угроз Tor и то, от чего он не защищает.</p>

<h2 id="chast2">Часть II — Протокол на низком уровне</h2>
<p>Криптография в Tor; архитектура сети; каналы и протокол связи (link protocol); ячейки;
построение цепей (CREATE_FAST, ntor, ntor-v3); послойное шифрование RELAY-ячеек и новая
схема CGO; потоки; SENDME и управление перегрузкой; система каталогов; выбор пути и
входные узлы (guard); onion-сервисы v3; защита от DoS; цензура, мосты и подключаемые
транспорты. Каждая глава завершается лабораторной работой.</p>

<h2 id="chast3">Часть III — Tor на практике</h2>
<p>Настройка tor через torrc; управляющий порт и Stem; построение частной сети Tor; анализ
трафика в Wireshark; запуск onion-сервисов, ретрансляторов и мостов; Tor Browser, Tails и
Whonix; Tor Metrics и OONI; правовые и этические вопросы в Италии и ЕС.</p>

<h2 id="chast4">Часть IV — Атаки и защита</h2>
<p>Корреляция трафика, website fingerprinting, атаки Сивиллы, реальные случаи и ошибки
пользователей. Подход аналитический и оборонительный: книга объясняет, почему атаки работают
и как Tor им противостоит, и не даёт инструкций против третьих лиц.</p>

<h2 id="chast5">Часть V — Исследования и будущее</h2>
<p>Академические исследования Tor, Arti (реализация Tor на Rust), открытые проблемы и текущие
предложения Tor Project.</p>

<h2 id="formaty">Форматы</h2>
<p>PDF A4 ({{pages_a4}} страниц), EPUB 3 и PDF формата 7×10 дюймов ({{pages_7x10}} страниц)
для печати личного экземпляра. PDF и EPUB собираются из одних и тех же исходников LaTeX
командой <code>make book</code>.</p>
"""

[pages.labs]
title = "Лабораторные работы в частной сети Tor — Onion Routing Anatomy"
