依据。无法核实的地方，会明确说明。</p>
<p>本书建立在我多年来撰写的学习笔记和研究资料之上。在我的指导下，人工智能工具实质性地
参与了内容扩展、论证、结构整理和正文撰写。尽管已经进行内部审阅和技术检查，书中仍可能存在
错误，欢迎<a href="{{p:contribute}}">报告问题并提出修正</a>。本项目遵循
<strong>「diffusione dei saperi senza fondare poteri」</strong>——传播知识，而不建立权力中心。
本书通过项目官方渠道免费提供，采用 GPL-3.0-or-later 许可证；按该许可证条款也可进行商业再分发。</p>

<h2 id="zuozhe">我的部分</h2>
<ul>
<li>项目的起源：我为本科毕业论文开始研究 Tor，毕业后继续研究。论文本身不在代码仓库中，
因此无法指出书中哪些段落源自论文。</li>
<li>工作方向与决策：目标和范围、作为语气与深度样板的章节、书名、许可证、免费发布，以及对每次
实验实机运行的授权。</li>
<li>对作品的审阅与维护，以及对所发布内容的编辑责任。</li>
</ul>

<h2 id="gongju">AI 工具所做的工作</h2>
<ul>
<li>现有的正文、插图、习题和答案，自 2026 年 9 月起在与 AI 编程助手 Claude Code 的会话中，
在我的指导下撰写。它们应被视为<strong>在人类指导下由 AI 生成</strong>的内容，而不是由我
撰写、仅经 AI 润色的文字。</li>
<li>实验代码、脚本和构建系统也是以同样方式编写的。</li>
<li>译本由 AI 工具生成；其审校同样是在使用 AI 工具的会话中完成的。</li>
<li>项目文档（包括本网站）是根据我提供的信息，借助 AI 起草的。</li>
</ul>

<h2 id="yanzheng">作品如何审阅，以及局限</h2>
<p><strong>内部审阅。</strong>我亲自审阅并维护本作品，它会持续得到修正和改进。</p>
<p><strong>自动化检查：</strong>在私有 Tor 网络上实机运行意大利语版实验（53/53 与 14/14 项
检查），离线测试，以及带有程序化检查和 EPUBCheck 校验的 PDF、EPUB 构建。</p>
<p><strong>独立审阅：</strong>目前尚无——没有同行评审或外部专家的验证，没有律师对法律章节的
审阅，也没有母语人士对译本的审校。</p>
<p>因此书中仍可能存在错误。如果你发现了错误，请<a href="{{p:contribute}}">告诉我们</a>。</p>

<p><a class="button" href="{{blob}}/AI_DISCLOSURE.md">阅读完整声明</a>（英语和意大利语）</p>
