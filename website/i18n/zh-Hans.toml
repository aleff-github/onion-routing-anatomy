[pages.story]
title = "项目由来 — Onion Routing Anatomy"
description = "Onion Routing Anatomy 的由来：为本科毕业论文研究 Tor，此后多年持续深入，用实验验证每种机制，最终决定自由发布。"
body = """
<h1>项目由来</h1>
<p class="lead">这个项目始于学习，随着时间推移，发展成为一本带有配套实验的技术书。本页讲述
它的经过。</p>

<h2 id="qiyuan">起源</h2>
<p>在撰写本科毕业论文期间，我开始深入研究 Tor，深入到通常描述它的层面之下：关注的不是
如何使用它，而是中继之间实际传输的内容——信元、电路、密钥，以及把它们组织在一起的算法。</p>
<p>这份兴趣并没有随着毕业而结束。在随后的几年里，我不断深化、重新整理和扩充这些材料。</p>

<h2 id="chengshu">从论文到图书</h2>
<p>随着时间推移，目标发生了变化。对我来说，仅仅理解 Tor 已经不够了：目标变成了一部能够具体讲解 Tor
的技术著作，深入到协议、信元、电路和算法，并让每一个论断都对应到规范和源代码。</p>

<h2 id="shiyan">为什么要做实验</h2>
<p>描述一种机制，并不能证明它真的按描述的方式运作。实验正是出于这一需要：在一台电脑上运行
一个私有 Tor 网络，书中的每一个步骤都可以在其中复现、测量和验证。如今实验已是本书的一部分：
共有二十个，每个实验都为一个小型教学用 Tor 客户端增加一个组件。</p>

<h2 id="mianfei">为什么免费</h2>
<p>我决定优先考虑知识的自由传播。整个项目——图书、LaTeX 源文件、代码和实验——都可以自由获取，
让任何人都可以学习、复现和改进它。本书免费提供；可以如何使用它，由其许可证 GNU GPL 规定。</p>
<p>现有文本是如何产生的，以及 AI 工具在其中起了什么作用，请见
<a href="{{p:ai}}">AI 透明度</a>页面。</p>
"""

[pages.book]
title = "图书内容 — Onion Routing Anatomy"
description = "Anatomia di Tor 的内容：历史、Tor 协议底层细节、Tor 实践、攻击与防御、研究与 Arti。共 31 章、176 道习题。"
body = """
<h1>图书内容</h1>
<p class="lead">31 章、4 个附录、176 道分级习题（附答案）、39 幅原创插图。参考版本：tor
{{tor}} 和 Arti {{arti}}。</p>
<p>本书面向具备网络（TCP/IP、TLS）和编程基础的大学生、安全从业者和研究人员。书中的技术论断
都对应到一手资料——Tor 规范、tor 和 Arti 的源代码、Tor Project 的提案以及研究论文——并在
正文中注明出处。</p>

<h2 id="di1bufen">第一部分 — 历史与基础</h2>
<p>匿名性与元数据；混合网络（mix network）与匿名转发邮件服务（remailer）；从美国海军研究
实验室（NRL）的洋葱路由到 Tor Project；Tor 的威胁模型，以及它无法防范的情形。</p>

<h2 id="di2bufen">第二部分 — 协议底层</h2>
<p>Tor 中的密码学；网络架构；通道与链路协议（link protocol）；信元；电路建立（CREATE_FAST、
ntor、ntor-v3）；RELAY 信元的分层加密与新的 CGO 方案；流（stream）；SENDME 与拥塞控制；
目录系统；路径选择与入口守卫（guard）；v3 洋葱服务；DoS 防御；审查、网桥与可插拔传输。
每章都以一个实验结束。</p>

<h2 id="di3bufen">第三部分 — Tor 实践</h2>
<p>用 torrc 配置 tor；控制端口与 Stem；搭建私有 Tor 网络；用 Wireshark 分析流量；运行洋葱
服务、中继和网桥；Tor 浏览器、Tails 与 Whonix；Tor Metrics 与 OONI；意大利和欧盟的法律与
伦理问题。</p>

<h2 id="di4bufen">第四部分 — 攻击与防御</h2>
<p>流量关联、网站指纹识别（website fingerprinting）、女巫攻击（Sybil）、真实案例和操作
失误。本书采取分析与防御的视角：解释攻击为何有效、Tor 如何应对，不提供针对他人的操作
指南。</p>

<h2 id="di5bufen">第五部分 — 研究与未来</h2>
<p>关于 Tor 的学术研究、Arti（用 Rust 实现的 Tor）、尚未解决的问题以及 Tor Project 当前的
提案。</p>

<h2 id="geshi">格式</h2>
<p>A4 PDF（{{pages_a4}} 页）、EPUB 3，以及用于打印个人副本的 7×10 英寸 PDF（{{pages_7x10}}
页）。PDF 和 EPUB 均由同一套 LaTeX 源文件通过 <code>make book</code> 生成。</p>
"""

[pages.labs]
title = "私有 Tor 网络上的实验 — Onion Routing Anatomy"
description = "二十个可复现的实验：一个用 Python 编写的教学用 Tor 客户端，在基于 Docker 和 Chutney 的私有 Tor 网络上测试，实机验证 53/53 项通过。"
body = """
<h1>实验</h1>
<p class="lead">二十个实验逐步构建 <code>torlab</code>——一个用 Python 编写的小型教学用 Tor
客户端：通道、信元、握手、加密、流、目录、路径选择、洋葱服务等等。</p>

<h2 id="wangluo">私有 Tor 网络</h2>
<p>代码运行在一台电脑上的私有 Tor 网络中：tor {{tor}} 和 Chutney 在 Docker 镜像中从源代码
编译，所有服务只监听 127.0.0.1。任何流量都不会离开这台机器。</p>
<p>这些实验只为这个私有网络而设计，绝不会针对公共中继或真实用户进行，遵循 Tor Research
Safety Board 的原则。</p>

<h2 id="yanzheng">经过验证，而不只是描述</h2>
<p>2026 年 10 月 28 日，所有意大利语版实验都在私有网络上重新实机运行：<strong>53/53</strong>
项检查通过，另外 obfs4 网桥实验 <strong>14/14</strong> 项通过。离线测试无需 Docker 或网络
即可检查代码和脚本。<a href="{{tree}}/docs/it/validazione">验证摘要</a>保存在代码仓库中。</p>

<h2 id="shishi">动手试试</h2>
<pre><code>git clone {{gh}}
cd onion-routing-anatomy
make -C labs/it test       # 离线测试（Python 3.11 或更高版本）
make -C labs/it immagine   # 构建包含 tor 和 Chutney 的 Docker 镜像
make -C labs/it avvia      # 启动私有网络
make verifica-lab          # 重新运行所有实验并检查结果</code></pre>
<p>分步指南位于 <a href="{{tree}}/labs/it/wiki"><code>labs/it/wiki</code></a>（意大利语）。
<code>labs/&lt;语言&gt;/wiki</code> 中的翻译版指南属于正在审校的译本。</p>
<p>有地方与描述不符？<a href="{{new}}04-laboratory.yml">报告实验问题</a>。</p>
"""

