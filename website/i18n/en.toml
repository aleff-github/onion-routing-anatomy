<h2 id="translations">About translation quality</h2>
<p>The translations were generated with AI tools and are published without independent native-speaker linguistic review. Translation, terminology and formatting errors may remain. The Italian original remains the authoritative reference.</p>
<p>Automated technical checks do not establish independent linguistic or scientific validation. The translated laboratories have not all been tested live.</p>
<p><a href="{{blob}}/docs/translation-review.md">Translation status and known limits</a>.</p>
<h2 id="review">Help improve a translation</h2>
<p>You can review a chapter or report a specific error. No LaTeX or Git experience is required.</p>
<p><a class="button" href="{{blob}}/docs/translation-review.md">Join the translation review</a>
