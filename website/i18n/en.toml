[pages.contribute]
title = "Contribute — help improve Onion Routing Anatomy"
description = "How to report an error, fix a translation, propose an improvement or contribute code to Onion Routing Anatomy, with or without Git and LaTeX."
body = """
<h1>Help improve this book</h1>
<p class="lead">This is a free and open book: contributions help improve its explanations, code and laboratories.</p>

<h2 id="ways">Ways to help</h2>
<ul class="cards">
<li><a href="{{new}}01-typo.yml"><strong>Report a typo</strong><span>A spelling mistake, a missing word, an unclear sentence.</span></a></li>
<li><a href="{{new}}02-translation.yml"><strong>Fix a translation</strong><span>A wrong or awkward passage in a translation.</span></a></li>
<li><a href="{{new}}03-technical-correction.yml"><strong>Technical correction</strong><span>A statement about Tor that is wrong or out of date.</span></a></li>
<li><a href="{{new}}04-laboratory.yml"><strong>Laboratory problem</strong><span>A laboratory that does not behave as described.</span></a></li>
<li><a href="{{new}}06-proposal.yml"><strong>Propose an improvement</strong><span>New content, a better explanation, a figure.</span></a></li>
<li><a href="{{blob}}/docs/translation-review.md"><strong>Join the translation review</strong><span>Review a chapter in your language.</span></a></li>
<li><a href="{{blob}}/CONTRIBUTING.md"><strong>Contribute code or text</strong><span>Open a pull request.</span></a></li>
<li><a href="{{new}}05-documentation.yml"><strong>Improve the documentation</strong><span>README, guides, instructions.</span></a></li>
</ul>

<h2 id="no-git">Without Git or LaTeX</h2>
<p>You only need a GitHub account. Choose the kind of report, fill in the form — the
language, the chapter or page, the current text and what you would write instead — and
submit it. That is enough: the change to the sources will be made by someone else.</p>
<p>For a small typo you can also propose the fix yourself: open the file on GitHub, click the
pencil icon, change the text and choose “Propose changes”. GitHub creates a copy of the
repository and a pull request for you; the book does not need to be built.</p>

<h2 id="pr">With Git</h2>
<ol>
<li>Open an issue first, unless the change is a small fix.</li>
<li>Find the file: the Italian text is in <code>source/it/</code>, translations in
<code>source/&lt;language&gt;/</code>, laboratory code in <code>labs/</code>.</li>
<li>Fork the repository, create a branch and make the change.</li>
<li>Run the checks that fit the change: <code>make check</code> and <code>make test</code>
need only Python; building the book needs Docker.</li>
<li>Open a pull request and answer the review.</li>
</ol>
<p>The details are in <a href="{{blob}}/CONTRIBUTING.md">CONTRIBUTING.md</a>.</p>

<h2 id="after">What happens next</h2>
<p>Every report is read and given a state: <em>to verify</em>, <em>confirmed</em>, <em>in
progress</em>, <em>fix proposed</em>, <em>resolved</em>, <em>not reproducible</em> or
<em>duplicate</em>. Changes to the protocol description, the cryptography or the laboratories
need a primary source or a reproducible proof; a typo needs only a quick check. Accepted
corrections go into the next version of the book and are listed in the
<a href="{{blob}}/CHANGELOG.md">changelog</a>. The process is described in
<a href="{{blob}}/docs/editorial-process.md">docs/editorial-process.md</a>.</p>

<h2 id="credit">Credit</h2>
<p>People whose contributions are accepted are listed in
<a href="{{blob}}/CONTRIBUTORS.md">CONTRIBUTORS.md</a>, under the GitHub name or the name
they choose. Anyone can ask not to be listed. There are no rankings.</p>

<h2 id="rules">Good to know</h2>
<ul>
<li>Contributions are accepted under the project's license, GPL-3.0-or-later.</li>
<li>Do not put personal data, private keys, packet captures or other sensitive material in
public issues.</li>
<li>Security problems in the code or the laboratories are reported privately: see
<a href="{{blob}}/SECURITY.md">SECURITY.md</a>.</li>
<li>Everyone is expected to follow the short <a href="{{blob}}/CODE_OF_CONDUCT.md">code of
conduct</a>.</li>
</ul>
"""

[pages.ai]
title = "AI transparency — Onion Routing Anatomy"
description = "How artificial intelligence was used to make Onion Routing Anatomy: human direction and AI tools, internal review, what was verified and what was not."
body = """
<h1>AI transparency</h1>
<p class="lead">This page summarises how artificial intelligence was used to make the book,
based only on what the project's records document. Where something cannot be verified, it
says so.</p>
<p>The book draws on study notes and documents I produced over the years.
Under my direction, AI tools substantially expanded, explained, structured and drafted
the present work. Despite internal reviews and checks, errors may remain; readers can
<a href="{{p:contribute}}">report and correct them</a>. The guiding principle is
<strong>"diffusione dei saperi senza fondare poteri"</strong> — sharing knowledge
without establishing power. It is free through the project's official channels, under
GPL-3.0-or-later, which also permits commercial redistribution on its terms.</p>

<h2 id="author">My part</h2>
<ul>
<li>The origin of the project: my study of Tor, begun for my bachelor's thesis and continued
afterwards. The thesis is not in the repository, so it is not possible to say which passages
derive from it.</li>
<li>The direction of the work and its decisions: goals and scope, the model chapter for tone
and level, title, license, free distribution, authorisation of each live laboratory run.</li>
<li>The review and maintenance of the work, and editorial responsibility for what is
published.</li>
</ul>

<h2 id="tools">What AI tools did</h2>
<ul>
<li>The current text, figures, exercises and solutions were drafted from September 2026 in
sessions with an AI coding assistant, Claude Code, under my direction. They should be
regarded as <strong>AI-generated under human direction</strong>, not as text I wrote and only
polished with AI.</li>
<li>The laboratory code, the scripts and the build system were written in the same way.</li>
<li>The translations were generated with AI tools; their review was also carried out in
sessions with AI tools.</li>
<li>The project documentation, including this website, was drafted with AI from information
I provided.</li>
</ul>

<h2 id="verified">How the work is checked, and the limits</h2>
<p><strong>Internal review.</strong> I review and maintain the work myself, and it keeps being
corrected and improved.</p>
<p><strong>Automated checks:</strong> live runs of the Italian laboratories on a private Tor
network (53/53 and 14/14 checks), offline tests, builds of the PDF and EPUB with
programmatic checks and EPUBCheck validation.</p>
<p><strong>Independent review:</strong> none so far — no peer review or validation by external
experts, no review of the legal chapter by a lawyer, no review of the translations by native
speakers.</p>
<p>Errors may therefore remain. If you find one, please <a href="{{p:contribute}}">report
it</a>.</p>

<p><a class="button" href="{{blob}}/AI_DISCLOSURE.md">Read the full disclosure</a>
(English and Italian)</p>
"""

