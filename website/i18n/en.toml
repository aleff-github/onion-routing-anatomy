[pages.story]
title = "The story of the project — Onion Routing Anatomy"
description = "How Onion Routing Anatomy began: study of Tor for a bachelor's thesis, years of further work, laboratories to verify each mechanism, and a free release."
body = """
<h1>The story</h1>
<p class="lead">The project began as study and became, over time, a technical book with its
own laboratories. This page tells how.</p>

<h2 id="origin">Where it comes from</h2>
<p>While working on my bachelor's thesis, I started to look at Tor below the level at which
it is usually described: not how to use it, but what actually travels between relays —
cells, circuits, keys, and the algorithms that hold them together.</p>
<p>My interest did not end with the degree. In the following years I kept studying the
material in more depth, reorganising and extending it.</p>

<h2 id="book">From a thesis to a book</h2>
<p>Over time the goal changed. Understanding Tor was no longer enough for me: the aim became a
technical work able to explain it concretely, down to the protocol, the cells, the circuits
and the algorithms, with every statement tied to the specifications and to the source code.</p>

<h2 id="labs">Why laboratories</h2>
<p>Describing a mechanism does not show that it works as described. The laboratories come from
that need: a private Tor network running on a single computer, where each step in the text
can be reproduced, measured and checked. They are now part of the book: twenty of them, each
adding a piece to a small educational Tor client.</p>

<h2 id="free">Why it is free</h2>
<p>I decided to give priority to the free circulation of knowledge. The whole project — the
book, its LaTeX sources, the code and the laboratories — is freely available, so that anyone
can study it, reproduce it and improve it. The book is free of charge; what can be done with
it is set by its license, the GNU GPL.</p>
<p>How the current text was produced, and which part AI tools played in it, is described on
the <a href="{{p:ai}}">AI transparency</a> page.</p>
"""

[pages.book]
title = "Inside the book — Onion Routing Anatomy"
description = "Contents of Anatomia di Tor: history, the Tor protocol at a low level, Tor in practice, attacks and defences, research and Arti. 31 chapters, 176 exercises."
body = """
<h1>Inside the book</h1>
<p class="lead">31 chapters and 4 appendices, 176 graded exercises with solutions, 39 original
figures. Reference versions: tor {{tor}} and Arti {{arti}}.</p>
<p>The book is written for university students, security professionals and researchers with a
background in networking (TCP/IP, TLS) and programming. Technical statements are tied to
primary sources — the Tor specifications, the source code of tor and Arti, Tor proposals and
research papers — and cited in the text.</p>

<h2 id="part1">Part I — History and foundations</h2>
<p>Anonymity and metadata; mix networks and remailers; from onion routing at the US Naval
Research Laboratory to the Tor Project; Tor's threat model and what it does not protect
against.</p>

<h2 id="part2">Part II — The protocol at a low level</h2>
<p>Cryptography for Tor; network architecture; channels and the link protocol; cells; circuit
creation (CREATE_FAST, ntor, ntor-v3); layered relay encryption and the new CGO scheme;
streams; SENDME and congestion control; the directory system; path selection and guards;
onion services v3; DoS defences; censorship, bridges and pluggable transports. Each chapter
ends with a laboratory.</p>

<h2 id="part3">Part III — Tor in practice</h2>
<p>Configuring tor with torrc; the control port and Stem; building a private Tor network;
traffic analysis with Wireshark; running onion services, relays and bridges; Tor Browser,
Tails and Whonix; Tor Metrics and OONI; legal and ethical aspects in Italy and the EU.</p>

<h2 id="part4">Part IV — Attacks and defences</h2>
<p>Traffic correlation, website fingerprinting, Sybil attacks, real cases and operational
mistakes. The approach is analytical and defensive: the book explains why attacks work and
how Tor counters them; it gives no instructions against third parties.</p>

<h2 id="part5">Part V — Research and future</h2>
<p>Academic research on Tor, Arti (the implementation of Tor in Rust), open problems and
current proposals of the Tor Project.</p>

<h2 id="formats">Formats</h2>
<p>PDF A4 ({{pages_a4}} pages), EPUB 3, and a 7×10 in PDF ({{pages_7x10}} pages) for printing a
personal copy. The PDF and EPUB are generated from the same LaTeX sources with
<code>make book</code>.</p>
<p><a href="https://doi.org/10.5281/zenodo.24207180">DOI: 10.5281/zenodo.24207180</a></p>
"""

[pages.labs]
title = "Laboratories on a private Tor network — Onion Routing Anatomy"
description = "Twenty reproducible laboratories: an educational Tor client in Python tested on a private Tor network built with Docker and Chutney, verified live 53/53."
body = """
<h1>Laboratories</h1>
<p class="lead">Twenty laboratories build <code>torlab</code>, a small educational Tor client
written in Python, piece by piece: channel, cells, handshakes, encryption, streams,
directories, path selection, onion services and more.</p>

<h2 id="network">A private Tor network</h2>
<p>The code runs against a private Tor network that lives on one computer: tor
{{tor}} and Chutney built from source in a Docker image, with every listener bound to
127.0.0.1. Nothing leaves the machine.</p>
<p>The experiments are designed for this private network only. They are never run against
public relays or real users, in line with the principles of the Tor Research Safety
Board.</p>

<h2 id="verified">Verified, not only described</h2>
<p>On 28 October 2026 all the Italian laboratories were rerun live on the private network:
<strong>53/53</strong> checks passed, plus <strong>14/14</strong> for the obfs4 bridge
laboratory. Offline tests cover the code and the scripts without Docker or network access.
The <a href="{{tree}}/docs/it/validazione">validation summaries</a> are in the repository.</p>

<h2 id="try">Try it</h2>
<pre><code>git clone {{gh}}
cd onion-routing-anatomy
make -C labs/it test       # offline tests (Python 3.11 or later)
make -C labs/it immagine   # Docker image with tor and Chutney
make -C labs/it avvia      # start the private network
make verifica-lab          # rerun every laboratory and check the results</code></pre>
<p>Step-by-step guides are in <a href="{{tree}}/labs/it/wiki"><code>labs/it/wiki</code></a>
(in Italian). Translated guides exist in <code>labs/&lt;language&gt;/wiki</code> as part of
the translations under review.</p>
<p>Something does not work as described? <a href="{{new}}04-laboratory.yml">Report a
laboratory problem</a>.</p>
"""

