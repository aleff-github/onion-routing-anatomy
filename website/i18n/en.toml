[pages.independence]
title = "Independence — Onion Routing Anatomy"
description = "Onion Routing Anatomy is an independent work, not endorsed by or affiliated with the Tor Project. No advertising, sponsorship or tracking."
body = """
<h1>Independence</h1>
<p class="lead">This book is an independent work. It is not endorsed or sponsored by, or
affiliated with, the Tor Project.</p>

<h2 id="tor-project">The Tor Project</h2>
<p>The book studies the Tor software, its specifications and its research. It does not speak
for the Tor Project, and the opinions in it are not those of the Tor Project. To use Tor, get
it from the Tor Project's official channels.</p>
<p>“Tor” and the Tor onion logo are trademarks of The Tor Project, Inc. The book does not use
the logo; the onion cross-section on the cover is original artwork.</p>

<h2 id="no-ads">No advertising, no tracking</h2>
<p>The book has no sponsors and contains no advertising. This website uses no cookies,
scripts, web fonts, analytics or third-party services. It is hosted on GitHub Pages; like
any web server, GitHub may record the IP addresses of visitors, as described in its privacy
statement.</p>

<h2 id="corrections">Corrections</h2>
<p>Independence also means that no organisation has reviewed the book on behalf of its
readers: corrections come from the people who read it. If you find an error,
<a href="{{p:contribute}}">please report it</a>.</p>
"""
