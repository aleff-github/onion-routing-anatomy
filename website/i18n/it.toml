<h2 id="translations">Qualità delle traduzioni</h2>
<p>Le traduzioni sono state generate con strumenti di intelligenza artificiale e sono pubblicate senza revisione linguistica indipendente da parte di madrelingua. Potrebbero contenere errori di traduzione, terminologia o impaginazione. L'originale italiano resta il riferimento.</p>
