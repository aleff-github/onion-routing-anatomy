<p><a class="button" href="{{blob}}/docs/translation-review.md">Partecipa alla revisione delle traduzioni</a>
<a class="button secondary" href="{{new}}02-translation.yml">Segnala un errore di traduzione</a></p>
"""

[pages.contribute]
title = "Contribuisci — aiuta a migliorare Anatomia di Tor"
description = "Come segnalare un errore, correggere una traduzione, proporre un miglioramento o contribuire al codice di Anatomia di Tor, anche senza Git e LaTeX."
body = """
<h1>Aiuta a migliorare il libro</h1>
<p class="lead">Il libro è un'opera libera e aperta ai contributi: ogni correzione può rendere più chiari il testo e i laboratori.</p>

<h2 id="come">Come aiutare</h2>
<ul class="cards">
<li><a href="{{new}}01-typo.yml"><strong>Segnala un refuso</strong><span>Un errore di ortografia, una parola mancante, una frase poco chiara.</span></a></li>
<li><a href="{{new}}02-translation.yml"><strong>Correggi una traduzione</strong><span>Un passaggio sbagliato o innaturale in una traduzione.</span></a></li>
<li><a href="{{new}}03-technical-correction.yml"><strong>Correzione tecnica</strong><span>Un'affermazione su Tor sbagliata o non più attuale.</span></a></li>
<li><a href="{{new}}04-laboratory.yml"><strong>Problema in un laboratorio</strong><span>Un laboratorio che non si comporta come descritto.</span></a></li>
<li><a href="{{new}}06-proposal.yml"><strong>Proponi un miglioramento</strong><span>Nuovi contenuti, una spiegazione migliore, una figura.</span></a></li>
<li><a href="{{blob}}/docs/translation-review.md"><strong>Revisione delle traduzioni</strong><span>Rivedi un capitolo nella tua lingua.</span></a></li>
<li><a href="{{blob}}/CONTRIBUTING.md"><strong>Contribuisci al testo o al codice</strong><span>Apri una pull request.</span></a></li>
<li><a href="{{new}}05-documentation.yml"><strong>Migliora la documentazione</strong><span>README, guide, istruzioni.</span></a></li>
</ul>

<h2 id="senza-git">Senza Git né LaTeX</h2>
<p>Basta un account GitHub. Scegli il tipo di segnalazione, compila il modulo — la lingua, il
capitolo o la pagina, il testo attuale e come lo scriveresti — e invialo. È sufficiente: la
modifica ai sorgenti la farà qualcun altro.</p>
<p>Per un piccolo refuso puoi anche proporre tu la correzione: apri il file su GitHub, fai clic
sull'icona della matita, modifica il testo e scegli «Propose changes». GitHub crea per te una
copia della repository e una pull request; non serve compilare il libro.</p>

<h2 id="con-git">Con Git</h2>
<ol>
<li>Apri prima una issue, a meno che la modifica non sia una piccola correzione.</li>
<li>Trova il file: il testo italiano è in <code>source/it/</code>, le traduzioni in
<code>source/&lt;lingua&gt;/</code>, il codice dei laboratori in <code>labs/</code>.</li>
<li>Fai un fork della repository, crea un branch e applica la modifica.</li>
<li>Esegui i controlli adatti alla modifica: <code>make check</code> e <code>make test</code>
richiedono solo Python; per compilare il libro serve Docker.</li>
<li>Apri una pull request e rispondi alla revisione.</li>
</ol>
<p>I dettagli sono in <a href="{{blob}}/CONTRIBUTING.md">CONTRIBUTING.md</a>.</p>

<h2 id="dopo">Che cosa succede dopo</h2>
<p>Ogni segnalazione viene letta e riceve uno stato: <em>da verificare</em>,
<em>confermata</em>, <em>in lavorazione</em>, <em>correzione proposta</em>, <em>risolta</em>,
<em>non riproducibile</em> o <em>duplicata</em>. Le modifiche alla descrizione del
protocollo, alla crittografia o ai laboratori richiedono una fonte primaria o una prova
riproducibile; per un refuso basta un controllo rapido. Le correzioni accettate entrano nella
versione successiva del libro e sono elencate nel <a href="{{blob}}/CHANGELOG.md">changelog</a>.
Il processo è descritto in <a href="{{blob}}/docs/editorial-process.md">docs/editorial-process.md</a>.</p>

<h2 id="riconoscimenti">Riconoscimenti</h2>
<p>Chi contribuisce con modifiche accettate compare in
<a href="{{blob}}/CONTRIBUTORS.md">CONTRIBUTORS.md</a>, con il nome GitHub o il nome che
preferisce. Si può chiedere di non comparire. Non ci sono classifiche.</p>

<h2 id="regole">Da sapere</h2>
<ul>
<li>I contributi sono accettati con la licenza del progetto, GPL-3.0-or-later.</li>
<li>Non inserire nelle issue pubbliche dati personali, chiavi private, catture di traffico o
altro materiale sensibile.</li>
<li>I problemi di sicurezza nel codice o nei laboratori si segnalano in privato: vedi
<a href="{{blob}}/SECURITY.md">SECURITY.md</a>.</li>
<li>Tutti sono tenuti a rispettare il breve <a href="{{blob}}/CODE_OF_CONDUCT.md">codice di
condotta</a>.</li>
</ul>
"""

[pages.ai]
title = "Trasparenza sull'uso dell'AI — Anatomia di Tor"
description = "Come è stata usata l'intelligenza artificiale per Anatomia di Tor: direzione umana e strumenti di AI, revisione interna, che cosa è stato verificato e che cosa no."
body = """
<h1>Trasparenza AI</h1>
<p class="lead">Questa pagina riassume come è stata usata l'intelligenza artificiale per
realizzare il libro, sulla base soltanto di ciò che i documenti del progetto registrano.
Quando qualcosa non è verificabile, lo dice.</p>
<p>Il libro si fonda su appunti e documenti di studio che ho prodotto negli anni.
Sotto la mia direzione, strumenti di IA hanno ampliato, argomentato e organizzato questi
materiali nella forma attuale, contribuendo in modo sostanziale anche alla stesura. Pur
dopo verifiche e revisione interna, possono esserci errori: invito a
<a href="{{p:contribute}}">segnalarli e correggerli</a>. Il principio è
<strong>«diffusione dei saperi senza fondare poteri»</strong>, con accesso gratuito
tramite il progetto e licenza GPL-3.0-or-later, che permette anche la redistribuzione commerciale.</p>

<h2 id="autore">La mia parte</h2>
<ul>
<li>L'origine del progetto: lo studio di Tor che ho iniziato per la mia tesi di laurea
triennale e ho proseguito dopo. La tesi non è nella repository, quindi non è possibile
indicare quali passaggi ne derivino.</li>
<li>La direzione del lavoro e le decisioni: obiettivi e ambito, il capitolo modello per tono e
livello, titolo, licenza, distribuzione gratuita, autorizzazione di ogni prova dal vivo dei
laboratori.</li>
<li>La revisione e la manutenzione dell'opera, e la responsabilità editoriale di ciò che viene
pubblicato.</li>
</ul>

<h2 id="strumenti">Che cosa hanno fatto gli strumenti di AI</h2>
<ul>
<li>Il testo attuale, le figure, gli esercizi e le soluzioni sono stati redatti dal settembre
2026 in sessioni con un assistente AI per la programmazione, Claude Code, sotto la mia
direzione. Vanno considerati <strong>generati con l'AI sotto direzione umana</strong>, non
testo scritto da me e soltanto rifinito con l'AI.</li>
<li>Allo stesso modo sono stati scritti il codice dei laboratori, gli script e il sistema di
build.</li>
<li>Le traduzioni sono state generate con strumenti di AI; anche la loro revisione è stata
svolta in sessioni con strumenti di AI.</li>
<li>La documentazione del progetto, compreso questo sito, è stata redatta con l'AI a partire
dalle informazioni che ho fornito.</li>
</ul>

<h2 id="verifiche">Come viene controllato il lavoro, e i limiti</h2>
<p><strong>Revisione interna.</strong> Rivedo e mantengo personalmente l'opera, che continua a
essere corretta e migliorata.</p>
<p><strong>Controlli automatici:</strong> esecuzione dal vivo dei laboratori italiani su una
rete Tor privata (53/53 e 14/14 controlli), test offline, compilazione di PDF ed EPUB con
controlli programmatici e validazione EPUBCheck.</p>
<p><strong>Revisione indipendente:</strong> finora nessuna — nessuna peer review né validazione
da parte di esperti esterni, nessuna revisione del capitolo legale da parte di un giurista,
nessuna revisione delle traduzioni da parte di madrelingua.</p>
<p>Possono quindi restare errori. Se ne trovi uno, <a href="{{p:contribute}}">segnalalo</a>.</p>

<p><a class="button" href="{{blob}}/AI_DISCLOSURE.md#italiano">Leggi la dichiarazione completa</a>
(in italiano e in inglese)</p>
"""

