[pages.story]
title = "La storia del progetto — Anatomia di Tor"
description = "Come è nato Anatomia di Tor: lo studio di Tor per la tesi triennale, anni di approfondimento, laboratori per verificare ogni meccanismo e la scelta di renderlo libero."
body = """
<h1>La storia</h1>
<p class="lead">Il progetto è nato come studio ed è diventato, con il tempo, un libro tecnico
con i suoi laboratori. Questa pagina racconta come.</p>

<h2 id="origine">Da dove nasce</h2>
<p>Durante il lavoro per la mia tesi di laurea triennale ho cominciato a guardare Tor sotto il
livello a cui di solito viene descritto: non come si usa, ma che cosa passa davvero fra i
relay — celle, circuiti, chiavi e gli algoritmi che li tengono insieme.</p>
<p>L'interesse non si è fermato con la laurea. Negli anni successivi ho continuato ad
approfondire il materiale, a riorganizzarlo e a estenderlo.</p>

<h2 id="libro">Dalla tesi al libro</h2>
<p>Con il tempo l'obiettivo è cambiato. Non mi bastava più capire Tor: lo scopo è diventato
un'opera tecnica capace di spiegarlo concretamente, fino al protocollo, alle celle, ai
circuiti e agli algoritmi, con ogni affermazione collegata alle specifiche e al codice
sorgente.</p>

<h2 id="laboratori">Perché i laboratori</h2>
<p>Descrivere un meccanismo non dimostra che funzioni come descritto. Da questa esigenza
nascono i laboratori: una rete Tor privata che gira su un solo computer, dove ogni passaggio
del testo si può riprodurre, misurare e verificare. Oggi fanno parte del libro: sono venti, e
ognuno aggiunge un pezzo a un piccolo client Tor didattico.</p>

<h2 id="libero">Perché è gratuito</h2>
<p>Ho deciso di privilegiare la libera diffusione della conoscenza. L'intero progetto — il
libro, i sorgenti LaTeX, il codice e i laboratori — è liberamente disponibile, perché chiunque
possa studiarlo, riprodurlo e migliorarlo. Il libro è gratuito; ciò che se ne può fare è
stabilito dalla sua licenza, la GNU GPL.</p>
<p>Come è stato prodotto il testo attuale, e quale parte vi hanno avuto gli strumenti di AI,
è spiegato nella pagina <a href="{{p:ai}}">Trasparenza AI</a>.</p>
"""

[pages.book]
title = "Il libro: contenuti — Anatomia di Tor"
description = "I contenuti di Anatomia di Tor: storia, il protocollo Tor a basso livello, Tor in pratica, attacchi e difese, ricerca e Arti. 31 capitoli e 176 esercizi."
body = """
<h1>Il libro</h1>
<p class="lead">31 capitoli e 4 appendici, 176 esercizi graduati con soluzioni, 39 figure
originali. Versioni di riferimento: tor {{tor}} e Arti {{arti}}.</p>
<p>Il libro è pensato per studenti universitari, professionisti della sicurezza e
ricercatori con basi di reti (TCP/IP, TLS) e di programmazione. Le affermazioni tecniche sono
collegate alle fonti primarie — le specifiche di Tor, il codice sorgente di tor e di Arti, le
proposte del Tor Project e gli articoli di ricerca — e citate nel testo.</p>

<h2 id="parte1">Parte I — Storia e fondamenti</h2>
<p>Anonimato e metadati; mix network e remailer; dall'onion routing dello US Naval Research
Laboratory al Tor Project; il modello di minaccia di Tor e ciò da cui non protegge.</p>

<h2 id="parte2">Parte II — Il protocollo a basso livello</h2>
<p>Crittografia per Tor; architettura della rete; canali e link protocol; celle; costruzione
dei circuiti (CREATE_FAST, ntor, ntor-v3); cifratura a strati dei relay cell e il nuovo
schema CGO; stream; SENDME e controllo di congestione; sistema delle directory; selezione del
percorso e guard; onion service v3; difese contro i DoS; censura, bridge e pluggable
transport. Ogni capitolo si chiude con un laboratorio.</p>

<h2 id="parte3">Parte III — Tor in pratica</h2>
<p>Configurare tor con il torrc; control port e Stem; costruire una rete Tor privata; analisi
del traffico con Wireshark; gestire onion service, relay e bridge; Tor Browser, Tails e
Whonix; Tor Metrics e OONI; aspetti legali ed etici in Italia e nell'UE.</p>

<h2 id="parte4">Parte IV — Attacchi e difese</h2>
<p>Correlazione del traffico, website fingerprinting, attacchi Sybil, casi reali ed errori
operativi. Il taglio è analitico e difensivo: il libro spiega perché gli attacchi funzionano
e come Tor li contrasta, senza istruzioni contro terzi.</p>

<h2 id="parte5">Parte V — Ricerca e futuro</h2>
<p>La ricerca accademica su Tor, Arti (l'implementazione di Tor in Rust), i problemi aperti e
le proposte in corso del Tor Project.</p>

<h2 id="formati">Formati</h2>
<p>PDF A4 ({{pages_a4}} pagine), EPUB 3 e PDF 7×10 pollici ({{pages_7x10}} pagine) per
stampare una copia personale. PDF ed EPUB si generano dagli stessi sorgenti LaTeX con
<code>make book</code>.</p>
"""

[pages.labs]
title = "Laboratori su una rete Tor privata — Anatomia di Tor"
description = "Venti laboratori riproducibili: un client Tor didattico in Python provato su una rete Tor privata con Docker e Chutney, verificata dal vivo con 53 controlli su 53."
body = """
<h1>Laboratori</h1>
<p class="lead">Venti laboratori costruiscono pezzo per pezzo <code>torlab</code>, un piccolo
client Tor didattico in Python: canale, celle, handshake, cifratura, stream, directory,
selezione del percorso, onion service e altro.</p>

<h2 id="rete">Una rete Tor privata</h2>
<p>Il codice si prova su una rete Tor privata che vive su un solo computer: tor {{tor}} e
Chutney compilati dai sorgenti in un'immagine Docker, con tutti i servizi in ascolto su
127.0.0.1. Niente esce dalla macchina.</p>
<p>Gli esperimenti sono pensati solo per questa rete privata. Non si eseguono mai contro relay
pubblici o utenti reali, secondo i principi del Tor Research Safety Board.</p>

<h2 id="verificati">Verificati, non solo descritti</h2>
<p>Il 28 ottobre 2026 tutti i laboratori italiani sono stati rieseguiti dal vivo sulla rete
privata: <strong>53/53</strong> controlli superati, più <strong>14/14</strong> per il
laboratorio sul bridge obfs4. I test offline coprono il codice e gli script senza Docker né
rete. I <a href="{{tree}}/docs/it/validazione">riepiloghi della validazione</a> sono nella
repository.</p>

<h2 id="prova">Provali</h2>
<pre><code>git clone {{gh}}
cd onion-routing-anatomy
make -C labs/it test       # test offline (Python 3.11 o successivo)
make -C labs/it immagine   # immagine Docker con tor e Chutney
make -C labs/it avvia      # avvia la rete privata
make verifica-lab          # riesegue tutti i laboratori e ne controlla i risultati</code></pre>
<p>Le guide passo per passo sono in <a href="{{tree}}/labs/it/wiki"><code>labs/it/wiki</code></a>.
Le guide tradotte, in <code>labs/&lt;lingua&gt;/wiki</code>, fanno parte delle traduzioni in
revisione.</p>
<p>Qualcosa non funziona come descritto? <a href="{{new}}04-laboratory.yml">Segnala un
problema in un laboratorio</a>.</p>
"""

