<h2 id="translations">Calidad de las traducciones</h2>
<p>Las traducciones se generaron con herramientas de IA y se publican sin una revisión lingüística independiente por hablantes nativos. Pueden contener errores de traducción, terminología o maquetación. El original italiano sigue siendo la referencia.</p>
<p>Los controles técnicos automáticos no equivalen a una validación lingüística o científica independiente. No todos los laboratorios traducidos se han probado en vivo.</p>
<p><a href="{{blob}}/docs/translation-review.md">Estado y límites de las traducciones</a>.</p>
<h2 id="review">Ayuda a mejorar una traducción</h2>
