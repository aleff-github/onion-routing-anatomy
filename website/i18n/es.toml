<p><a class="button" href="{{blob}}/docs/translation-review.md">Participa en la revisión de traducciones</a>
<a class="button secondary" href="{{new}}02-translation.yml">Informa de un problema de traducción</a></p>
"""

[pages.contribute]
title = "Colaborar — ayuda a mejorar Onion Routing Anatomy"
description = "Cómo informar de un error, corregir una traducción, proponer una mejora o aportar código a Onion Routing Anatomy, con o sin Git y LaTeX."
body = """
<h1>Ayuda a mejorar este libro</h1>
<p class="lead">Esta obra libre está abierta a contribuciones para mejorar las explicaciones, el código y los laboratorios.</p>

<h2 id="formas">Formas de ayudar</h2>
<ul class="cards">
<li><a href="{{new}}01-typo.yml"><strong>Informar de una errata</strong><span>Una falta de ortografía, una palabra que falta, una frase poco clara.</span></a></li>
<li><a href="{{new}}02-translation.yml"><strong>Corregir una traducción</strong><span>Un pasaje erróneo o poco natural en una traducción.</span></a></li>
<li><a href="{{new}}03-technical-correction.yml"><strong>Corrección técnica</strong><span>Una afirmación sobre Tor que es errónea o está desactualizada.</span></a></li>
<li><a href="{{new}}04-laboratory.yml"><strong>Problema en un laboratorio</strong><span>Un laboratorio que no se comporta como se describe.</span></a></li>
<li><a href="{{new}}06-proposal.yml"><strong>Proponer una mejora</strong><span>Contenido nuevo, una explicación mejor, una figura.</span></a></li>
<li><a href="{{blob}}/docs/translation-review.md"><strong>Revisión de las traducciones</strong><span>Revisa un capítulo en tu idioma.</span></a></li>
<li><a href="{{blob}}/CONTRIBUTING.md"><strong>Aportar texto o código</strong><span>Abre una pull request.</span></a></li>
<li><a href="{{new}}05-documentation.yml"><strong>Mejorar la documentación</strong><span>README, guías, instrucciones.</span></a></li>
</ul>

<h2 id="sin-git">Sin Git ni LaTeX</h2>
<p>Solo necesitas una cuenta de GitHub. Elige el tipo de aviso, rellena el formulario — el
idioma, el capítulo o la página, el texto actual y lo que escribirías en su lugar — y envíalo.
Con eso basta: otra persona hará el cambio en las fuentes.</p>
<p>Para una errata pequeña también puedes proponer tú la corrección: abre el archivo en GitHub,
pulsa el icono del lápiz, cambia el texto y elige «Propose changes». GitHub crea por ti una
copia del repositorio y una pull request; no hace falta compilar el libro.</p>

<h2 id="con-git">Con Git</h2>
<ol>
<li>Abre primero una issue, salvo que el cambio sea una corrección pequeña.</li>
<li>Localiza el archivo: el texto italiano está en <code>source/it/</code>, las traducciones en
<code>source/&lt;idioma&gt;/</code>, el código de los laboratorios en <code>labs/</code>.</li>
<li>Haz un fork del repositorio, crea una rama y aplica el cambio.</li>
<li>Ejecuta las comprobaciones adecuadas: <code>make check</code> y <code>make test</code>
solo necesitan Python; para compilar el libro hace falta Docker.</li>
<li>Abre una pull request y responde a la revisión.</li>
</ol>
<p>Los detalles están en <a href="{{blob}}/CONTRIBUTING.md">CONTRIBUTING.md</a> (en inglés y
en italiano).</p>

<h2 id="despues">Qué pasa después</h2>
<p>Cada aviso se lee y recibe un estado: <em>por verificar</em>, <em>confirmado</em>, <em>en
curso</em>, <em>corrección propuesta</em>, <em>resuelto</em>, <em>no reproducible</em> o
<em>duplicado</em>. Los cambios en la descripción del protocolo, en la criptografía o en los
laboratorios requieren una fuente primaria o una prueba reproducible; para una errata basta una
comprobación rápida. Las correcciones aceptadas entran en la siguiente versión del libro y se
recogen en el <a href="{{blob}}/CHANGELOG.md">registro de cambios</a>. El proceso se describe
en <a href="{{blob}}/docs/editorial-process.md">docs/editorial-process.md</a>.</p>

<h2 id="reconocimiento">Reconocimiento</h2>
<p>Quienes aportan cambios aceptados aparecen en
<a href="{{blob}}/CONTRIBUTORS.md">CONTRIBUTORS.md</a>, con su nombre de GitHub o el nombre que
prefieran. Cualquiera puede pedir no aparecer. No hay clasificaciones.</p>

<h2 id="normas">Conviene saber</h2>
<ul>
<li>Las contribuciones se aceptan bajo la licencia del proyecto, GPL-3.0-or-later.</li>
<li>No pongas en las issues públicas datos personales, claves privadas, capturas de tráfico ni
otro material sensible.</li>
<li>Los problemas de seguridad en el código o en los laboratorios se comunican en privado: véase
<a href="{{blob}}/SECURITY.md">SECURITY.md</a>.</li>
<li>Se espera que todas las personas respeten el breve <a href="{{blob}}/CODE_OF_CONDUCT.md">código
de conducta</a>.</li>
</ul>
"""

[pages.ai]
title = "Transparencia sobre el uso de IA — Onion Routing Anatomy"
description = "Cómo se usó la inteligencia artificial para hacer Onion Routing Anatomy: dirección humana y herramientas de IA, revisión interna, qué se verificó y qué no."
body = """
<h1>Transparencia IA</h1>
<p class="lead">Esta página resume cómo se usó la inteligencia artificial para hacer el libro,
basándose solo en lo que documentan los registros del proyecto. Cuando algo no se puede
verificar, lo dice.</p>
<p>La obra parte de apuntes y documentos de estudio que he elaborado durante años.
Bajo mi dirección, las herramientas de IA contribuyeron sustancialmente a ampliar,
argumentar, organizar y redactar el texto. A pesar de las comprobaciones y la revisión
interna, puede haber errores: invito a <a href="{{p:contribute}}">señalarlos y
corregirlos</a>. El principio es <strong>«diffusione dei saperi senza fondare poteri»</strong>:
difundir conocimientos sin instaurar poderes. La obra se ofrece gratis por los canales
oficiales, bajo GPL-3.0-or-later, que también permite la redistribución comercial.</p>

<h2 id="autor">Mi parte</h2>
<ul>
<li>El origen del proyecto: el estudio de Tor que empecé para mi trabajo de fin de grado y
continué después. El trabajo no está en el repositorio, así que no es posible decir qué
pasajes derivan de él.</li>
<li>La dirección del trabajo y sus decisiones: objetivos y alcance, el capítulo modelo para el
tono y el nivel, título, licencia, distribución gratuita, autorización de cada ejecución en vivo
de los laboratorios.</li>
<li>La revisión y el mantenimiento de la obra, y la responsabilidad editorial sobre lo que se
publica.</li>
</ul>

<h2 id="herramientas">Qué hicieron las herramientas de IA</h2>
<ul>
<li>El texto actual, las figuras, los ejercicios y las soluciones se redactaron desde
septiembre de 2026 en sesiones con un asistente de programación con IA, Claude Code, bajo mi
dirección. Deben considerarse <strong>generados con IA bajo dirección humana</strong>, no
texto escrito por mí y solo pulido con IA.</li>
<li>El código de los laboratorios, los scripts y el sistema de compilación se escribieron de la
misma manera.</li>
<li>Las traducciones se generaron con herramientas de IA; su revisión también se hizo en
sesiones con herramientas de IA.</li>
<li>La documentación del proyecto, incluido este sitio web, se redactó con IA a partir de la
información que proporcioné.</li>
</ul>

<h2 id="verificado">Cómo se revisa el trabajo, y sus límites</h2>
<p><strong>Revisión interna.</strong> Reviso y mantengo personalmente la obra, que se sigue
corrigiendo y mejorando.</p>
<p><strong>Comprobaciones automáticas:</strong> ejecución en vivo de los laboratorios italianos
en una red Tor privada (53/53 y 14/14 comprobaciones), pruebas sin conexión, compilación del
PDF y del EPUB con comprobaciones programáticas y validación con EPUBCheck.</p>
<p><strong>Revisión independiente:</strong> ninguna hasta ahora — ni revisión por pares ni
validación de expertos externos, ni revisión del capítulo jurídico por un abogado, ni revisión
de las traducciones por hablantes nativos.</p>
<p>Por tanto, pueden quedar errores. Si encuentras uno, <a href="{{p:contribute}}">infórmanos</a>.</p>

<p><a class="button" href="{{blob}}/AI_DISCLOSURE.md">Leer la declaración completa</a>
(en inglés y en italiano)</p>
