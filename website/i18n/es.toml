[pages.story]
title = "La historia del proyecto — Onion Routing Anatomy"
description = "Cómo nació Onion Routing Anatomy: el estudio de Tor para un trabajo de fin de grado, años de trabajo, laboratorios para verificar cada mecanismo y una publicación libre."
body = """
<h1>La historia</h1>
<p class="lead">El proyecto nació como estudio y se convirtió, con el tiempo, en un libro
técnico con sus propios laboratorios. Esta página cuenta cómo.</p>

<h2 id="origen">De dónde viene</h2>
<p>Mientras preparaba mi trabajo de fin de grado, empecé a mirar Tor por debajo del nivel en
que suele describirse: no cómo se usa, sino qué viaja realmente entre los repetidores —
celdas, circuitos, claves y los algoritmos que los mantienen unidos.</p>
<p>Mi interés no terminó con la carrera. En los años siguientes seguí estudiando el material
más a fondo, reorganizándolo y ampliándolo.</p>

<h2 id="libro">Del trabajo de fin de grado al libro</h2>
<p>Con el tiempo el objetivo cambió. Ya no me bastaba con entender Tor: la meta pasó a ser una obra
técnica capaz de explicarlo de forma concreta, hasta el protocolo, las celdas, los circuitos y
los algoritmos, con cada afirmación ligada a las especificaciones y al código fuente.</p>

<h2 id="laboratorios">Por qué los laboratorios</h2>
<p>Describir un mecanismo no demuestra que funcione como se describe. De esa necesidad nacen
los laboratorios: una red Tor privada que funciona en un solo ordenador, donde cada paso del
texto se puede reproducir, medir y comprobar. Hoy forman parte del libro: son veinte, y cada
uno añade una pieza a un pequeño cliente Tor didáctico.</p>

<h2 id="libre">Por qué es gratuito</h2>
<p>Decidí dar prioridad a la libre difusión del conocimiento. Todo el proyecto — el libro, sus
fuentes LaTeX, el código y los laboratorios — está a libre disposición para que cualquiera
pueda estudiarlo, reproducirlo y mejorarlo. El libro es gratuito; lo que se puede hacer con él
lo establece su licencia, la GNU GPL.</p>
<p>Cómo se produjo el texto actual, y qué papel tuvieron en ello las herramientas de IA, se
explica en la página <a href="{{p:ai}}">Transparencia IA</a>.</p>
"""

[pages.book]
title = "El libro: contenidos — Onion Routing Anatomy"
description = "Contenido de Anatomia di Tor: historia, el protocolo Tor a bajo nivel, Tor en la práctica, ataques y defensas, investigación y Arti. 31 capítulos, 176 ejercicios."
body = """
<h1>El libro</h1>
<p class="lead">31 capítulos y 4 apéndices, 176 ejercicios graduados con soluciones, 39 figuras
originales. Versiones de referencia: tor {{tor}} y Arti {{arti}}.</p>
<p>El libro está pensado para estudiantes universitarios, profesionales de la seguridad e
investigadores con conocimientos de redes (TCP/IP, TLS) y de programación. Las afirmaciones
técnicas están ligadas a las fuentes primarias — las especificaciones de Tor, el código fuente
de tor y de Arti, las propuestas del Tor Project y los artículos de investigación — y se citan
en el texto.</p>

<h2 id="parte1">Parte I — Historia y fundamentos</h2>
<p>Anonimato y metadatos; redes de mezcla (mix networks) y remailers; del onion routing del US
Naval Research Laboratory al Tor Project; el modelo de amenazas de Tor y aquello de lo que no
protege.</p>

<h2 id="parte2">Parte II — El protocolo a bajo nivel</h2>
<p>Criptografía para Tor; arquitectura de la red; canales y protocolo de enlace; celdas; creación de circuitos (CREATE_FAST, ntor, ntor-v3); cifrado por capas de
las celdas RELAY y el nuevo esquema CGO; flujos (streams); SENDME y control de
congestión; el sistema de directorios; selección de ruta y repetidores de entrada (<em>guard</em>); servicios onion
v3; defensas contra DoS; censura, puentes y transportes conectables. Cada capítulo termina con
un laboratorio.</p>

<h2 id="parte3">Parte III — Tor en la práctica</h2>
<p>Configurar tor con el torrc; el puerto de control y Stem; construir una red Tor privada;
análisis de tráfico con Wireshark; servicios onion, repetidores y puentes; Tor Browser, Tails y
Whonix; Tor Metrics y OONI; aspectos legales y éticos en Italia y en la UE.</p>

<h2 id="parte4">Parte IV — Ataques y defensas</h2>
<p>Correlación de tráfico, website fingerprinting, ataques Sybil, casos reales y errores
operativos. El enfoque es analítico y defensivo: el libro explica por qué funcionan los ataques
y cómo los contrarresta Tor, sin dar instrucciones contra terceros.</p>

<h2 id="parte5">Parte V — Investigación y futuro</h2>
<p>La investigación académica sobre Tor, Arti (la implementación de Tor en Rust), los problemas
abiertos y las propuestas en curso del Tor Project.</p>

<h2 id="formatos">Formatos</h2>
<p>PDF A4 ({{pages_a4}} páginas), EPUB 3 y un PDF de 7×10 pulgadas ({{pages_7x10}} páginas)
para imprimir una copia personal. El PDF y el EPUB se generan a partir de las mismas fuentes
LaTeX con <code>make book</code>.</p>
"""

[pages.labs]
title = "Laboratorios en una red Tor privada — Onion Routing Anatomy"
description = "Veinte laboratorios reproducibles: un cliente Tor didáctico en Python probado en una red Tor privada con Docker y Chutney, verificada en vivo con 53/53 comprobaciones."
body = """
<h1>Laboratorios</h1>
<p class="lead">Veinte laboratorios construyen, pieza a pieza, <code>torlab</code>, un pequeño
cliente Tor didáctico escrito en Python: canal, celdas, handshakes, cifrado, flujos,
directorios, selección de ruta, servicios onion y más.</p>

<h2 id="red">Una red Tor privada</h2>
<p>El código se prueba en una red Tor privada que vive en un solo ordenador: tor {{tor}} y
Chutney compilados desde las fuentes en una imagen Docker, con todos los servicios escuchando
en 127.0.0.1. Nada sale de la máquina.</p>
<p>Los experimentos están pensados solo para esta red privada. Nunca se ejecutan contra
repetidores públicos ni usuarios reales, de acuerdo con los principios del Tor Research Safety
Board.</p>

<h2 id="verificados">Verificados, no solo descritos</h2>
<p>El 28 de octubre de 2026 todos los laboratorios italianos se volvieron a ejecutar en vivo en
la red privada: <strong>53/53</strong> comprobaciones superadas, más <strong>14/14</strong> en
el laboratorio del puente obfs4. Las pruebas sin conexión cubren el código y los scripts sin
Docker ni red. Los <a href="{{tree}}/docs/it/validazione">resúmenes de la validación</a> están en
el repositorio.</p>

<h2 id="probar">Pruébalos</h2>
<pre><code>git clone {{gh}}
cd onion-routing-anatomy
make -C labs/it test       # pruebas sin conexión (Python 3.11 o posterior)
make -C labs/it immagine   # imagen Docker con tor y Chutney
make -C labs/it avvia      # arranca la red privada
make verifica-lab          # vuelve a ejecutar todos los laboratorios y comprueba los resultados</code></pre>
<p>Las guías paso a paso están en <a href="{{tree}}/labs/it/wiki"><code>labs/it/wiki</code></a>
(en italiano). Las guías traducidas, en <code>labs/&lt;idioma&gt;/wiki</code>, forman parte de
las traducciones en revisión.</p>
<p>¿Algo no funciona como se describe? <a href="{{new}}04-laboratory.yml">Informa de un
problema en un laboratorio</a>.</p>
"""

