#
# Configurazione del sito (scripts/build_site.py). Le pagine si generano in build/site/.

# Indirizzo pubblico del sito su GitHub Pages:
# canonical, hreflang, Open Graph e sitemap lo usano, quindi va verificato con
# `make site-check-online` subito dopo l'attivazione. Con un dominio personalizzato,
# cambiare base_url (e base_path = "/") e rigenerare il sito.
base_url  = "https://aleff-github.github.io/onion-routing-anatomy/"
base_path = "/onion-routing-anatomy/"

repo   = "https://github.com/aleff-github/onion-routing-anatomy"
branch = "main"

# Lingue del sito, nell'ordine del selettore. La prima e' quella di riserva (x-default
# delle pagine interne); la radice del sito e' una pagina di scelta della lingua.
languages = ["en", "it", "es", "ru", "zh-Hans"]

[edition]
version  = "1.0.0"
language = "it"
tor      = "0.4.9.13"
arti     = "2.6.0"
pages_a4 = 298
pages_7x10 = 342

[release]
tag = "v1.0.0-it"
# false: collegamenti diretti ai file della repository, senza dichiarazioni pubbliche
# sullo stato della release. true: collegamenti a una release GitHub esistente.
# Il cambio di questo flag non pubblica ne' il repository ne' il sito.
published = true
doi = "10.5281/zenodo.24207180"
pdf  = "anatomia-di-tor_it_A4.pdf"
epub = "anatomia-di-tor_it.epub"
print = "anatomia-di-tor_it_7x10.pdf"

# Le edizioni tradotte sono gia' pubblicate come release indipendenti.
# I nomi degli asset nelle release possono differire da quelli in book/<lingua>/.
[translated_releases.en]
tag = "v1.0.0-en"
published = true
pdf = "anatomy-of-tor_en_A4.pdf"
epub = "anatomy-of-tor_en.epub"
print = "anatomy-of-tor_en_7x10.pdf"
doi = "10.5281/zenodo.24207675"

[translated_releases.es]
tag = "v1.0.0-es"
published = true
pdf = "anatomia-de-tor_es_A4.pdf"
epub = "anatomia-de-tor_es.epub"
print = "anatomia-de-tor_es_7x10.pdf"
doi = "10.5281/zenodo.24207811"

[translated_releases.ru]
tag = "v1.0.0-ru"
published = true
pdf = "anatomiya-tor_ru_A4.pdf"
epub = "anatomiya-tor_ru.epub"
print = "anatomiya-tor_ru_7x10.pdf"
doi = "10.5281/zenodo.24207874"

[translated_releases.zh-Hans]
tag = "v1.0.0-zh-Hans"
published = true
pdf = "tor-jiepou_zh-Hans_A4.pdf"
epub = "tor-jiepou_zh-Hans.epub"
print = "tor-jiepou_zh-Hans_7x10.pdf"
doi = "10.5281/zenodo.24207976"
